# Skill dictionary: name, category (cat), aliases.
#   aliases  - matched case-insensitively on token boundaries (so "java" never fires inside "javascript")
#   cs: true - aliases are case-sensitive (AWS, SAS, React, Excel ... words that are also ordinary English)
#   pattern  - hand-written regex for the truly ambiguous short names (Go, R, C); case-sensitive
# Boundary rule used by enrich.py: not preceded by [A-Za-z0-9_], not followed by [A-Za-z0-9_+#].

# ---------------- languages ----------------
- {name: Python, cat: language, aliases: [python, python3]}
- {name: JavaScript, cat: language, aliases: [javascript, ecmascript, es6]}
- {name: TypeScript, cat: language, aliases: [typescript]}
- {name: Java, cat: language, aliases: [java]}
- {name: "C#", cat: language, aliases: ["c#", csharp, "c sharp"]}
- {name: "C++", cat: language, aliases: ["c++", cpp]}
- name: C
  cat: language
  # bare "C" only inside a tech list ("C, C++", "C/C++", "in C and"), never "Series C" or "C-level"
  pattern: '(?<![A-Za-z0-9_\-])(?<!Series )(?<!series )C(?=\s?[,/]\s?(?:C\+\+|Rust|Go|Python|Java|Assembly|Linux|Obj))|(?<=[,/] )C(?= (?:and|or) )|(?<=in )C(?= (?:and|or|programming|for)\b)|(?<![A-Za-z0-9_])C(?= programming)|(?<=C\+\+/)C(?![A-Za-z0-9_+#\-])|(?<=C\+\+, )C(?![A-Za-z0-9_+#\-])'
- name: Go
  cat: language
  # "Golang" always; bare capitalised "Go" only when it sits in a list or next to a tech word
  pattern: '(?i:\bgolang\b)|(?<![A-Za-z0-9_])Go(?=\s?[,/)(|;]|\s(?:and|or|developers?|engineers?|backend|back-end|services|microservices|programming|experience|codebase|\+)\b)|(?<=[,/(|] )Go(?![A-Za-z0-9_])|(?<=[,/(|])Go(?![A-Za-z0-9_])|(?:(?<= in )|(?<=and )|(?<= or ))Go(?=[.,;)]|\s?$)'
- name: R
  cat: language
  # bare "R" only inside a list or "R programming"; never "R&D"
  pattern: '(?<![A-Za-z0-9_&])R(?=\s?[,/]\s?(?:Python|SQL|SAS|Stata|Julia|Matlab|MATLAB|Shiny|Tableau|Scala|Java|Spark|or|and))|(?<=Python, )R(?![A-Za-z0-9_&+#])|(?<=Python/)R(?![A-Za-z0-9_&+#])|(?<=SQL, )R(?![A-Za-z0-9_&+#])|(?<=Python or )R(?![A-Za-z0-9_&+#])|(?<=Python and )R(?![A-Za-z0-9_&+#])|(?<![A-Za-z0-9_&])R(?= (?:programming|language|Shiny|packages?|and Python|or Python)\b)|\bRStudio\b|\btidyverse\b|\bggplot2?\b'
